name: Update Resume

on:
  push:
    branches: [main]
    paths:
      - 'repos-config.json'
      - 'skills-verified.json'
      - 'resume-template.json'

permissions:
  contents: write

jobs:
  regenerate-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install docx package
        run: npm install docx

      - name: Install LibreOffice (for PDF conversion)
        run: sudo apt-get update && sudo apt-get install -y libreoffice

      - name: Generate resume.docx
        run: node scripts/generate-resume.js

      - name: Convert to PDF
        run: soffice --headless --convert-to pdf resume.docx

      - name: Commit updated resume
        run: |
          git config user.name "Resume Auto-Update"
          git config user.email "actions@github.com"
          git add resume.docx resume.pdf
          if git diff --staged --quiet; then
            echo "No changes to resume — skipping commit."
          else
            git commit -m "Auto-update resume from portfolio changes [skip ci]"
            git push
          fi
